<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e293b" />
    <title>Tidak Ada Koneksi - Digital Shift</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgb(15 23 42 / 8%);
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
        width: 100%;
      }
      .icon {
        align-items: center;
        background: #1e293b;
        border-radius: 14px;
        color: #ffffff;
        display: inline-flex;
        font-size: 24px;
        height: 56px;
        justify-content: center;
        margin-bottom: 20px;
        width: 56px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      a {
        background: #1e293b;
        border-radius: 10px;
        color: #ffffff;
        display: inline-block;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 20px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">!</div>
      <h1>Tidak Ada Koneksi</h1>
      <p>
        Aplikasi tidak dapat terhubung ke internet. Periksa koneksi Anda, lalu
        coba muat ulang halaman.
      </p>
      <a href="/">Coba Lagi</a>
    </main>
  </body>
</html>
